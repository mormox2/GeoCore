name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release & Publish Packages
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Build All Workspaces
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Publish to NPM Registry
        if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          # Also refreshes package-lock.json so the version PR keeps it in sync.
          version-script: npm run version-packages
          pr-title: "chore(release): version and publish packages"
          commit-message: "chore(release): version and publish packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # changesets/action v2 no longer writes .npmrc: npm reads this token through
          # the .npmrc that actions/setup-node created from registry-url.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version Packages (NPM Token Pending)
        if: env.HAS_NPM_TOKEN != 'true'
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
