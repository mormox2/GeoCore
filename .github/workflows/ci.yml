name: GeoCore CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test All Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --prefer-offline

      - name: Build All Packages
        run: npm run build

      - name: Run Full Test Suite
        run: npm test

      - name: Validate Example Repositories
        run: |
          npm run validate:rtimidental
          npm run validate:dawajinpro
